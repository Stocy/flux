apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: http-filter-redirect
    namespace: otterwiki 
spec:
    hostnames:
        - wiki.${SECRET_DOMAIN_0}
    parentRefs:
        - name: http-gateway
          sectionName: http
          namespace: kube-system
    rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
